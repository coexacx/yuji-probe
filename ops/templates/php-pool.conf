[yuji-probe]
user = yuji-probe
group = yuji-probe
listen = __PHP_SOCKET__
listen.owner = __NGINX_USER__
listen.group = __NGINX_USER__
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 10s
pm.max_requests = 500
clear_env = yes
env[PROBE_SERVICE_MANAGED] = 1
catch_workers_output = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/lib/yuji-probe/php-error.log
php_admin_value[session.save_path] = /var/lib/yuji-probe/sessions
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen
php_admin_value[post_max_size] = 24M
php_admin_value[memory_limit] = 128M
