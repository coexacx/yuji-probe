server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/yuji-probe-acme; default_type text/plain; try_files $uri =404; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;
    if ($host != __DOMAIN__) { return 421; }
    server_tokens off;
    ssl_certificate /etc/yuji-probe/tls/fullchain.pem;
    ssl_certificate_key /etc/yuji-probe/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YujiTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 24m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    autoindex off;
    access_log off; # Keep ownership-link credentials out of request logs.
    error_log /var/log/nginx/yuji-probe.error.log;
    location ~ ^/(?:app|bin|storage|backend|src|source|docs|ops|qa|vendor|node_modules)(?:/|$) { return 404; }
    location ~ /\. { return 404; }
    location = /_internal/health { return 404; }
    location = /api/agent {
        proxy_pass http://127.0.0.1:19281;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 185s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
    location = /api/terminal {
        proxy_pass http://127.0.0.1:19281;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 185s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
    location = /api/enroll/claim {
        proxy_pass http://127.0.0.1:19281;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Probe-Gateway "";
        proxy_read_timeout 185s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:19281;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Probe-Gateway "";
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
        proxy_send_timeout 30s;
    }
}
