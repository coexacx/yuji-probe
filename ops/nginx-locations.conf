# Put these locations inside the HTTPS server block. Root must point to public/.
# Keep BaoTa's PHP include (enable-php-80.conf or a newer PHP version).
index index.php;
client_max_body_size 16k;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 15s;
keepalive_timeout 30s;

autoindex off;
location ~ ^/(?:app|bin|storage|backend|src|source|docs|ops|qa|vendor|node_modules)(?:/|$) { return 404; }
location ~ /\. { return 404; }
location = /api/agent {
 proxy_pass http://127.0.0.1:19281;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_read_timeout 65s;
 proxy_send_timeout 15s;
 proxy_buffering off;
 proxy_intercept_errors on;
 error_page 502 = /index.php?probe_wake=1;
}
location = /api/terminal {
 proxy_pass http://127.0.0.1:19281;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_read_timeout 65s;
 proxy_send_timeout 15s;
 proxy_buffering off;
 proxy_intercept_errors on;
 error_page 502 = /index.php?probe_wake=1;
}
location / { try_files $uri /index.php$is_args$args; }
