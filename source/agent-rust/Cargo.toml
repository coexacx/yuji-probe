[package]
name = "vistart-probe-agent"
version = "0.1.3-rust.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
base64 = "0.23.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustix = { version = "1.1.5", features = ["fs", "rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "net", "time", "sync", "signal", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
