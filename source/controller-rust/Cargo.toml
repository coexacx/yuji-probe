[package]
name = "vistart-probe-controller"
version = "0.6.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[features]
test-deployment = []

[dependencies]
vistart-probe-agent = { path = "../agent-rust" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "io-util", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
bcrypt = "0.19.3"
pbkdf2 = "0.13"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
data-encoding = "2.11.1"
hex = "0.4"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
getrandom = "0.4"
zeroize = "1.9"
rustix = { version = "1.1.5", features = ["fs", "process"] }
ed25519-dalek = "2.2"
flate2 = "1.1"
tar = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
