<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安装羽迹探针</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf2f6;color:#25333f;font:15px/1.6 system-ui,sans-serif}main{width:min(420px,calc(100vw - 64px));padding:32px;border-radius:20px;background:#ffffffcc;border:1px solid #fff;box-shadow:0 12px 48px #14263612}h1{font-size:24px;margin:0 0 6px}p{color:#607280;margin:0 0 24px}label{display:block;margin:14px 0 5px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd7df;border-radius:9px;font:inherit}button{margin-top:24px;background:#263f55;color:white;cursor:pointer}#error{color:#a32929;white-space:pre-wrap;margin-top:16px}small{color:#607280}</style><main><h1>安装羽迹探针</h1><p>Nginx + Rust · 无需数据库</p><div id="locked">请使用服务器状态目录 setup-link.txt 中的一次性安装链接。</div><form id="setup" hidden><label for="name">站点名称</label><input id="name" name="name" required maxlength="60" value="羽迹探针"><label for="username">管理员用户名</label><input id="username" name="username" required maxlength="32" value="admin" autocomplete="username"><label for="password">管理员密码</label><input id="password" name="password" type="password" required minlength="12" maxlength="72" autocomplete="new-password"><small>12 至 72 字节</small><button>完成安装</button></form><div id="error" role="alert"></div></main><script type="module" src="/setup.js"></script></html>
